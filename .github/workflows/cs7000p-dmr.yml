name: "CS7000-PLUS DMR (no codec)"
# Builds the flat CS7000-PLUS image with the DMR receive mode enabled.  The
# AMBE+2 codec is NOT included (it is Connect Systems' code): merge it in
# locally with scripts/cs7000_codec_extract.py, see
# platform/drivers/vocoder/README.md.
on:
  workflow_dispatch:
  push:
    branches: [ "cs7000p-dmr" ]

# The build environment (devcontainer image with the Miosix GCC toolchain,
# compiled from source) takes about 25 minutes to build, the firmware itself
# a few seconds.  The image is pushed to this account's GitHub container
# registry and reused as the build cache, so it is only rebuilt when
# .devcontainer/ changes.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile using devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kg5iru/openrtx-devcontainer
          cacheFrom: ghcr.io/kg5iru/openrtx-devcontainer
          push: always
          runCmd: |
            meson setup --cross-file cross_cm7.txt -Dcs7000_ambe=true build_cm7_dmr &&
            meson compile -C build_cm7_dmr openrtx_cs7000p_bin &&
            chmod -R a+rX build_cm7_dmr
      - name: Upload flat image
        uses: actions/upload-artifact@v4
        with:
          name: openrtx_cs7000p_dmr_flat
          path: build_cm7_dmr/openrtx_cs7000p_bin
          if-no-files-found: error
