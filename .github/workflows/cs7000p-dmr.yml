name: "CS7000-PLUS DMR"
# Builds the CS7000-PLUS image with the DMR receive mode, the USB system log
# (rtxlink_log, on by default) and the voice prompts.  The AMBE+2 codec is NOT
# in the image: it is called in place in the stock HOST V9.00.96 firmware the
# radio keeps flashed (-Dcs7000_ambe_stock=true), so the image holds no
# Connect Systems code and is uploaded both flat and wrapped for the vendor
# Factory Tool.  See platform/drivers/vocoder/README.md.
on:
  workflow_dispatch:
  push:
    branches: [ "cs7000p-dmr", "cs7000p-ysf" ]

# The build environment (devcontainer image with the Miosix GCC toolchain,
# compiled from source) takes about 25 minutes to build, the firmware itself
# a few seconds.  The image is pushed to this account's GitHub container
# registry and reused as the build cache, so it is only rebuilt when
# .devcontainer/ changes.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile using devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/kg5iru/openrtx-devcontainer
          cacheFrom: ghcr.io/kg5iru/openrtx-devcontainer
          push: always
          runCmd: |
            meson setup --cross-file cross_cm7.txt -Dcs7000_ambe=true -Dcs7000_ambe_stock=true build_cm7_dmr &&
            meson compile -C build_cm7_dmr openrtx_cs7000p_bin &&
            python3 scripts/cs7000_wrap.py build_cm7_dmr/openrtx_cs7000p_bin build_cm7_dmr/openrtx_cs7000p_dmr_wrapped.bin &&
            chmod -R a+rX build_cm7_dmr
      - name: Upload flat image
        uses: actions/upload-artifact@v4
        with:
          name: openrtx_cs7000p_dmr_flat
          path: build_cm7_dmr/openrtx_cs7000p_bin
          if-no-files-found: error
      - name: Upload wrapped image (flash with the Factory Tool)
        uses: actions/upload-artifact@v4
        with:
          name: openrtx_cs7000p_dmr_wrapped
          path: build_cm7_dmr/openrtx_cs7000p_dmr_wrapped.bin
          if-no-files-found: error
